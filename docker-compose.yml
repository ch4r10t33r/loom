# A minimal distributed Loom swarm on one host, for trying the token-loop
# expert fetch without any external model:
#
#   origin  generates a synthetic deepseek2 GGUF, shards it, and serves it as
#           the bootnode (holds every expert shard).
#   node2   bootstraps ~30% of the expert shards from the origin, then serves
#           the same model, fetching the experts it lacks from the origin at
#           token time.
#
#   docker compose up --build
#   curl -s localhost:8782/v1/completions -d '{"prompt":"the","max_tokens":8}'
#     (node2's OpenAI port; a hit_rate < 1 on the RPC response = peer fetch)
#
# Ports are published to 127.0.0.1 only (security issue #33). The RPC and
# OpenAI surfaces have no TLS and no authentication (see spec/SPEC.md
# "Transport security"), so a bare "8770:8770" would expose an unauthenticated
# inference endpoint on every host interface. Do not widen these without
# putting an authenticating reverse proxy in front.
#
# Peers address each other by Compose service name ("origin"): the p2p layer
# resolves hostnames via src/p2p/dns.zig.

services:
  origin:
    build: .
    image: loom:dev
    entrypoint: ["sh", "-c"]
    command:
      - >
        loom gguf gen /home/loom/model.gguf --arch deepseek2 --seed 1 &&
        exec loom node --gguf /home/loom/model.gguf
        --rpc-addr 0.0.0.0 --openai-port 8772
        --p2p-addr 0.0.0.0 --p2p-port 8771 --advertise origin:8771
    ports:
      - "127.0.0.1:8770:8770"   # rpc
      - "127.0.0.1:8772:8772"   # openai
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g


  node2:
    image: loom:dev
    depends_on: [origin]
    entrypoint: ["sh", "-c"]
    # retry the bootstrap until the origin has generated + sharded the model and
    # is accepting joins (loom node exits 0 if the bootstrap peer isn't ready).
    command:
      - >
        sleep 6;
        while true; do
        loom node --bootstrap origin:8771 --hold-fraction 0.3
        --rpc-addr 0.0.0.0 --openai-port 8772
        --p2p-addr 0.0.0.0 --p2p-port 8781 --advertise node2:8781;
        echo 'node2: bootstrap not ready, retrying in 3s'; sleep 3;
        done
    ports:
      - "127.0.0.1:8780:8770"   # rpc
      - "127.0.0.1:8782:8772"   # openai
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g

