<!doctype html>
<meta charset="utf-8">
<title>loom</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: #0f1115; --panel: #161922; --line: #262b38; --fg: #e6e8ee;
    --dim: #8a91a3; --accent: #6ea8fe; --user: #1e2740; --warn: #f0a35e;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa; --panel: #fff; --line: #e2e5ec; --fg: #1a1d24;
      --dim: #6b7280; --accent: #2563eb; --user: #e8eefc; --warn: #a35b12;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { font-weight: 650; letter-spacing: .02em; }
  .brand span { color: var(--accent); }
  .meta { color: var(--dim); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--dim); margin-right: 5px; vertical-align: 1px; }
  .dot.up { background: #3fb950; } .dot.down { background: #f85149; }
  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; }
  .who { flex: 0 0 58px; color: var(--dim); font-size: 12px; padding-top: 3px; text-transform: lowercase; }
  .body { flex: 1; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .body { background: var(--user); padding: 8px 12px; border-radius: 8px; }
  .msg.err .body { color: var(--warn); }
  .stats { color: var(--dim); font-size: 12px; margin-top: 4px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 200px; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    color: var(--fg); font: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 11px 18px; border: 0; border-radius: 8px; background: var(--accent);
    color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--dim); font-weight: 400; padding: 11px 10px; }
  .controls { max-width: 760px; margin: 8px auto 0; display: flex; gap: 16px;
              align-items: center; color: var(--dim); font-size: 12.5px; flex-wrap: wrap; }
  .controls input[type=number] { width: 74px; background: var(--bg); color: var(--fg);
              border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }
  .banner { background: color-mix(in srgb, var(--warn) 16%, transparent);
            border-bottom: 1px solid var(--line); color: var(--warn);
            padding: 9px 16px; font-size: 13px; }
  code { background: var(--panel); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
</style>

<header>
  <div class="brand">loo<span>m</span></div>
  <div class="meta">
    <span id="status"><span class="dot"></span>connecting</span>
    <span id="model"></span>
    <span id="peers"></span>
  </div>
</header>

<div id="warn" class="banner" hidden></div>

<main><div class="wrap" id="log">
  <div class="empty">
    Send a message to run inference on this node.<br>
    Routed experts this node does not hold are fetched from peers mid-token.
  </div>
</div></main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message the model…  (Enter to send, Shift+Enter for a newline)"></textarea>
    <button id="send">Send</button>
    <button id="stop" class="ghost" hidden>Stop</button>
  </div>
  <div class="controls">
    <label>temp <input id="temp" type="number" value="0.7" min="0" max="2" step="0.1"></label>
    <label>max tokens <input id="maxtok" type="number" value="256" min="1" max="4096" step="1"></label>
    <label><input id="stream" type="checkbox" checked> stream</label>
    <button class="ghost" id="clear" type="button">clear</button>
  </div>
</footer>

<script>
// Served from the node's own HTTP surface, so every request is same-origin and
// there is no CORS story and no host to configure.
const $ = (id) => document.getElementById(id);
const log = $('log');
let history = [];      // [{role, content}]
let inflight = null;   // AbortController for the current generation

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function addMsg(role, text, cls) {
  if (log.querySelector('.empty')) log.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'msg ' + (cls || role);
  el.innerHTML = `<div class="who">${esc(role)}</div><div class="body"></div>`;
  el.querySelector('.body').textContent = text;
  log.appendChild(el);
  el.scrollIntoView({ block: 'end' });
  return el.querySelector('.body');
}

function setStatus(up, label) {
  $('status').innerHTML = `<span class="dot ${up ? 'up' : 'down'}"></span>${esc(label)}`;
}

// Health also carries node state, so the header doubles as a liveness check
// while a long generation is running.
let lastHealth = null;
async function poll() {
  try {
    const r = await fetch('/health');
    const j = await r.json();
    lastHealth = j;
    setStatus(true, 'connected');
    if (j.model) $('model').textContent = j.model;
    // Random-weight fixtures produce gibberish by construction. Say so, or the
    // first thing anyone testing a fresh node sees looks like a broken model.
    if (j.synthetic) {
      $('warn').hidden = false;
      $('warn').textContent =
        'This node is serving a synthetic model with random weights, so replies will be ' +
        'meaningless text. That is expected. Start the node with --gguf pointing at a real ' +
        'model to get coherent output.';
    } else {
      $('warn').hidden = true;
    }
    if (typeof j.peers === 'number') {
      $('peers').textContent = j.peers === 1 ? '1 peer' : `${j.peers} peers`;
    }
    if (typeof j.hit_rate === 'number' && j.hit_rate > 0) {
      $('peers').textContent += ` · hit ${(j.hit_rate * 100).toFixed(0)}%`;
    }
  } catch {
    setStatus(false, 'node unreachable');
  }
}
poll();
setInterval(poll, 5000);

function busy(on) {
  $('send').disabled = on;
  $('stop').hidden = !on;
  if (!on) $('input').focus();
}

async function send() {
  const text = $('input').value.trim();
  if (!text || inflight) return;
  $('input').value = '';
  $('input').style.height = 'auto';
  addMsg('you', text, 'user');
  history.push({ role: 'user', content: text });

  const out = addMsg('loom', '');
  const started = performance.now();
  let acc = '';
  let delegated = false;
  // The server emits exactly one SSE frame per token, so counting frames is an
  // exact token count -- no need for the client to guess from whitespace, and
  // no need for the server to send usage on the streaming path.
  let ntok = 0;
  let firstTok = 0;
  busy(true);
  inflight = new AbortController();

  // Live feedback while the node grinds: on a partial store the first token
  // waits for every missing expert the prefill needs, which can be minutes
  // over a home link. An empty bubble for that long reads as a hang.
  const ticker = setInterval(() => {
    if (acc) return; // first token arrived; stop narrating
    const el = Math.round((performance.now() - started) / 1000);
    let line = `generating… ${el}s`;
    if (lastHealth && typeof lastHealth.hit_rate === 'number') {
      line += `  ·  ${(lastHealth.hit_rate * 100).toFixed(1)}% of expert reads local`;
    }
    out.textContent = line +
      '\nmissing experts stream from peers on first use; cold requests take minutes and permanently warm this node';
  }, 1000);

  // The server rejects a model name that is not the one this node serves,
  // so send the id /health reported -- and no model field at all before the
  // first poll lands, which the server treats as "whatever you serve".
  const req = {
    messages: history,
    temperature: parseFloat($('temp').value),
    max_tokens: parseInt($('maxtok').value, 10),
    stream: $('stream').checked,
  };
  if (lastHealth && lastHealth.model) req.model = lastHealth.model;

  try {
    const r = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(req),
      signal: inflight.signal,
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0, 300)}`);

    if (req.stream) {
      // text/event-stream: accumulate, split on blank lines, stop at [DONE].
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const frame = buf.slice(0, i); buf = buf.slice(i + 2);
          if (!frame.startsWith('data:')) continue;
          const payload = frame.slice(5).trim();
          if (payload === '[DONE]') continue;
          try {
            const delta = JSON.parse(payload).choices?.[0]?.delta?.content;
            if (delta !== undefined && delta !== null) {
              if (!ntok) firstTok = performance.now();
              ntok++;
              acc += delta;
              out.textContent = acc;
              out.scrollIntoView({ block: 'end' });
            }
          } catch { /* a partial frame; the next read completes it */ }
        }
      }
    } else {
      const j = await r.json();
      acc = j.choices?.[0]?.message?.content ?? '';
      out.textContent = acc;
      ntok = j.usage?.completion_tokens ?? 0;
      if (j.loom_delegated) delegated = true;
    }

    history.push({ role: 'assistant', content: acc });
    const now = performance.now();
    const total = (now - started) / 1000;
    // Two rates, because they answer different questions. Decode speed excludes
    // the prompt: on a partial node the first token also pays for every expert
    // fetch the prefill needed, so folding it in understates steady-state
    // throughput badly.
    const parts = [`${ntok} tok`];
    if (ntok > 1 && firstTok) {
      const decode = (now - firstTok) / 1000;
      if (decode > 0) parts.push(`${((ntok - 1) / decode).toFixed(1)} tok/s`);
      parts.push(`first token ${((firstTok - started) / 1000).toFixed(2)}s`);
    } else if (total > 0 && ntok) {
      parts.push(`${(ntok / total).toFixed(1)} tok/s`);
    }
    parts.push(`${total.toFixed(1)}s total`);
    if (delegated) parts.push('answered by a warmer peer while your store warms');
    const s = document.createElement('div');
    s.className = 'stats';
    s.textContent = parts.join('  ·  ');
    out.appendChild(s);   // inside .body, so it wraps under the text rather than
                          // becoming a third flex item that overflows the row
  } catch (e) {
    if (e.name === 'AbortError') {
      out.textContent = acc + '\n[stopped]';
    } else {
      out.textContent = '[no response]';
      addMsg('error', String(e.message || e), 'err');
    }
  } finally {
    clearInterval(ticker);
    inflight = null;
    busy(false);
  }
}

$('send').onclick = send;
$('stop').onclick = () => inflight?.abort();
$('clear').onclick = () => {
  history = [];
  log.innerHTML = '<div class="empty">Cleared. Conversation history is reset.</div>';
};
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 200) + 'px';
});
$('input').focus();
</script>
